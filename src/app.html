<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#faf9f6" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
			rel="stylesheet"
		/>
		<noscript>
			<style>
				[data-reveal] {
					opacity: 1 !important;
					transform: none !important;
				}
			</style>
		</noscript>
		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="bg-paper font-sans text-base leading-normal text-ink antialiased"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
